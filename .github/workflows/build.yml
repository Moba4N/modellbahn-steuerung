name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Ubuntu-Runner bringen das Android SDK mit.
    runs-on: ubuntu-latest
    permissions:
      contents: write # fuer den Branch "screenshots"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Bauen und testen (Kern, Simulator, Android, Desktop)
        run: ./gradlew build
      - name: Sandbox ausfuehren
        run: ./gradlew :tools:sandbox:run
      - name: Vorschaubilder hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vorschaubilder
          path: apps/desktop/build/screenshots/*.png
      - name: Vorschaubilder im Branch "screenshots" ablegen
        # Nur fuer Aenderungen aus diesem Repository (nicht aus Forks).
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          src="$GITHUB_WORKSPACE/apps/desktop/build/screenshots"
          dir=$(mktemp -d) && cd "$dir"
          git init -q && git checkout -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin screenshots; then git reset -q --hard origin/screenshots; fi
          mkdir -p "$BRANCH" && cp "$src"/*.png "$BRANCH/"
          git add -A
          git commit -q -m "Vorschaubilder fuer $BRANCH (${GITHUB_SHA::7})" || exit 0
          git push -q origin screenshots

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows-Installer bauen
        run: ./gradlew :apps:desktop:packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/build/compose/binaries/main/msi/*.msi
      - name: MSIX-Paket bauen (Microsoft Store)
        shell: pwsh
        # Name und Publisher aus dem Partner Center als Repository-Variablen MSIX_IDENTITY_NAME,
        # MSIX_PUBLISHER und MSIX_PUBLISHER_DISPLAY_NAME hinterlegen; sonst gelten Platzhalter.
        run: |
          ./gradlew :apps:desktop:createDistributable
          $p = @{
            AppDir = "apps/desktop/build/compose/binaries/main/app/Modellbahn-Steuerung"
            OutDir = "apps/desktop/build/msix"
            Version = "0.1.0"
            TestSign = $true
          }
          if ("${{ vars.MSIX_IDENTITY_NAME }}") { $p.IdentityName = "${{ vars.MSIX_IDENTITY_NAME }}" }
          if ("${{ vars.MSIX_PUBLISHER }}") { $p.Publisher = "${{ vars.MSIX_PUBLISHER }}" }
          if ("${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}") { $p.PublisherDisplayName = "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}" }
          New-Item -ItemType Directory -Force $p.OutDir | Out-Null
          ./apps/desktop/packaging/msix/build-msix.ps1 @p
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: |
            apps/desktop/build/msix/*.msix
            apps/desktop/build/msix/*.cer
